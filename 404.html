<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found</title>
<script>
/* Apply saved theme and language before first paint */
try {
  var th = localStorage.getItem('theme');
  if (!th) th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if (th === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  if (localStorage.getItem('lang') === 'fr') document.documentElement.lang = 'fr';
} catch (e) {}
</script>
<link rel="preload" href="/fonts/bricolage-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#10111A">
<style>
  body{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:var(--gutter); }
  .nf-code{ font-family:var(--font-display); font-weight:800; font-stretch:85%; font-size:var(--step-5); line-height:var(--lh-tight); letter-spacing:var(--track-display); }
  .nf-text{ color:var(--ink-dim); margin:var(--s-4) 0 var(--s-6); max-width:52ch; }
  .nf-link{ display:inline-flex; align-items:center; min-height:var(--tap); padding:0 var(--s-5); width:fit-content; background:var(--accent); color:var(--on-accent); border-radius:var(--r-chip); font-weight:600; }
  .nf-link:hover{ background:var(--accent-hover); color:var(--on-accent); }
  .nf-ruler{ margin-top:var(--s-7); }
</style>
</head>
<body>
  <h1 class="nf-code">404</h1>
  <p class="nf-text" id="nfText">This page does not exist. The link may be old, or the address may have a typo.</p>
  <a class="nf-link" href="/" id="nfLink">Back to home</a>
  <div class="ruler nf-ruler" aria-hidden="true"></div>
  <script>
    if (document.documentElement.lang === 'fr') {
      document.title = 'Page introuvable';
      document.getElementById('nfText').textContent = "Cette page n'existe pas. Le lien est peut-être ancien, ou l'adresse contient une faute de frappe.";
      document.getElementById('nfLink').textContent = "Retour à l'accueil";
    }
  </script>
</body>
</html>
